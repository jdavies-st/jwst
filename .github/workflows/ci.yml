name: CI

on:
  push:
    branches:
      - master
      - '*x'
    tags:
      - '*'
  pull_request:
  schedule:
    # Weekly Monday 9AM build
    - cron: "0 9 * * 1"
  workflow_dispatch:

env:
  CRDS_SERVER_URL: https://jwst-crds.stsci.edu
  CRDS_PATH: $HOME/crds_cache
  CRDS_CLIENT_RETRY_COUNT: 3
  CRDS_CLIENT_RETRY_DELAY_SECONDS: 20

jobs:
  tox:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.10 Tests
            python-version: '3.10'
            os: ubuntu-latest
            toxenv: py310

          # - name: Latest dependency versions w/coverage
          #   os: ubuntu-latest
          #   python-version: 3.9
          #   toxenv: py39-cov

          # - name: Oldest dependency versions
          #   os: ubuntu-latest
          #   python-version: 3.8
          #   toxenv: py38-oldestdeps-cov

          # - name: SDP dependencies in requirements-sdp.txt
          #   os: ubuntu-latest
          #   python-version: 3.9
          #   toxenv: sdpdeps

          # - name: Installed package with --pyargs
          #   os: ubuntu-latest
          #   python-version: 3.9
          #   toxenv: pyargs

          # - name: Verify install_requires in setup.py
          #   os: ubuntu-latest
          #   python-version: 3.9
          #   toxenv: verify-install-requires

          # - name: Build distribution
          #   os: ubuntu-latest
          #   python-version: 3.9
          #   toxenv: twine

          # - name: Code style check
          #   os: ubuntu-latest
          #   python-version: 3.9
          #   toxenv: style

          # - name: Security audit
          #   os: ubuntu-latest
          #   python-version: 3.9
          #   toxenv: security

          # MacOS job is flaky on Github actions and fails routinely.
          # Re-enable when things get more reliable.
          # - name: macOS
          #   os: macos-latest
          #   python-version: 3.9
          #   toxenv: py39
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: setup.cfg
      - name: Install tox
        run: |
          pip install tox
      - name: Get CRDS context
        id: crds-context
        # See https://hst-crds.stsci.edu/static/users_guide/web_services.html#generic-request
        run: >
          echo "pmap=$(
          curl -s -X POST -d '{"jsonrpc": "1.0", "method": "get_default_context", "params": ["jwst"], "id": 1}' https://jwst-crds.stsci.edu/json/ |
          python -c "import sys, json; print(json.load(sys.stdin)['result'])"
          )" >> $GITHUB_OUTPUT
      - run: echo "${{ steps.crds-context.outputs.pmap }}"
      - name: Run tests
        run: tox -e ${{ matrix.toxenv }}
      - uses: actions/cache@v3
        with:
          path: ${{ env.CRDS_PATH }}
          key: crds-reffiles-context-${{ steps.crds-context.outputs.pmap }}
      - name: Upload coverage to codecov
        if: ${{ contains(matrix.toxenv,'-cov') }}
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unit
          fail_ci_if_error: true
